[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# card_eval_status_text alignment patches 
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
match_indent = true
position = 'before'
pattern = '''elseif card.jimbo then'''
payload = '''
elseif card.area == G.ca_vic_zodiac then
    y_off = 0.05*card.T.h
'''

# Zodiac cardarea
[[patches]]
[patches.pattern]
target = 'game.lua'
match_indent = true
position = 'before'
pattern = 'self.deck = CardArea('
payload = '''self.ca_vic_zodiac = CardArea(
    G.TILE_W - 6*G.CARD_W - 2.95, -1.1*G.jokers.T.h - 1.1*G.jokers.T.h, -- hide it during alpha
    G.jokers.T.w, G.jokers.T.h,
    { type = "joker", card_limit = 13 }
)

-- SMODS.add_card{key = "j_vic_gemini", area = self.ca_vic_zodiac, skip_materialize = true, no_edition = true}
-- SMODS.add_card{key = "j_vic_cancer", area = self.ca_vic_zodiac, skip_materialize = true, no_edition = true}
'''

# Zodiac calculation
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
match_indent = true
position = 'before'
pattern = '-- TARGET: add your own CardAreas for joker evaluation'
payload = '''
local vic_joker_idx = 0
for k, v in ipairs(t) do
    vic_joker_idx = vic_joker_idx + 1
    if v == G.jokers then
       break
    end
end
table.insert(t, vic_joker_idx, G.ca_vic_zodiac)
'''

